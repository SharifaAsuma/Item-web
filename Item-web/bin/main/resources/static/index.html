<!DOCTYPE html>
<!--
  所持品管理・画面本体(HTML)。
  中身のデータはここには書かず、script.js が /api/items から取得して
  JavaScriptで一覧やフォームを作る(見た目は style.css、動きは script.js に分けている)。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>所持品管理</title>

  <!-- 本文・数値用の Inter と、日本語用の Noto Sans JP(読み込めない環境ではOS標準のゴシック体になる) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー: ロゴ(線画のSVG)とアプリ名だけのシンプルな帯 -->
  <header class="app-header">
    <div class="wrap header-inner">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3.8 8.2 12 12.5l8.2-4.3M12 12.5v7.8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="app-title">所持品管理</span>
    </div>
  </header>

  <main class="wrap">

    <!-- 操作したあとの結果メッセージ(「追加しました」など)を出す場所。普段は非表示 -->
    <div id="toast" class="toast" role="status" hidden></div>

    <!-- 件数・金額のまとめ。中の数字だけ script.js が書き換える -->
    <div class="stat-row" aria-label="所持品のまとめ">
      <div class="stat">
        <span class="stat-label">所持品</span>
        <div class="stat-value"><strong id="statTotal">0</strong><span>点</span></div>
      </div>
      <div class="stat">
        <span class="stat-label">購入金額の合計</span>
        <div class="stat-value"><strong id="statSum">0</strong><span>円</span></div>
      </div>
      <div class="stat stat-soon">
        <span class="stat-label">保証期限が近い</span>
        <div class="stat-value"><strong id="statSoon">0</strong><span>点</span></div>
      </div>
    </div>

    <!-- 検索・カテゴリの絞り込み・手放した所持品の表示・追加ボタン -->
    <div class="toolbar">
      <div class="toolbar-controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="search" id="searchBox" placeholder="名前・保管場所・店舗・備考で検索">
        </div>
        <select id="categoryFilter" aria-label="カテゴリで絞り込み">
          <option value="">すべてのカテゴリ</option>
          <!-- カテゴリの選択肢は script.js が /api/meta から取得して追加する -->
        </select>
        <label class="checkbox">
          <input type="checkbox" id="includeDisposed">
          手放した所持品も表示
        </label>
      </div>
      <button id="openAddButton" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        所持品を追加
      </button>
    </div>

    <!-- 一覧表(中身の行は script.js が組み立てる)。列見出しをクリックすると並び替えできる -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="name" tabindex="0" role="button">名前</th>
            <th data-sort="category" tabindex="0" role="button">カテゴリ</th>
            <th data-sort="location" tabindex="0" role="button">保管場所</th>
            <th data-sort="purchase" tabindex="0" role="button">購入日</th>
            <th data-sort="price" tabindex="0" role="button">値段</th>
            <th data-sort="store" tabindex="0" role="button">購入店舗</th>
            <th data-sort="warranty" tabindex="0" role="button">保証期限</th>
            <th>備考</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="itemsBody">
          <!-- ここに1件ごとの <tr> が追加される -->
        </tbody>
      </table>
      <!-- 何も無いときの案内(単なる空表示ではなく、次にすることを示す) -->
      <div id="emptyMessage" class="empty" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16V8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M3.8 8.2 12 12.5l8.2-4.3M12 12.5v7.8" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        <p>まだ何も登録されていません</p>
        <button class="btn sub" id="emptyAddButton">最初の所持品を追加する</button>
      </div>
    </div>
  </main>

  <!-- 追加・編集フォーム(モーダル)。普段は非表示にしておき、ボタンを押したときだけ表示する -->
  <div id="formOverlay" class="overlay" hidden>
    <form id="itemForm" class="card form" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="form-head">
        <h2 id="formTitle">所持品を追加</h2>
        <button type="button" id="closeXButton" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="formErrors" class="error" hidden></div>

      <input type="hidden" id="itemId">

      <label class="field"><span>名前 *</span>
        <input type="text" id="fieldName" maxlength="100" required>
      </label>

      <div class="field-row">
        <label class="field"><span>カテゴリ *</span>
          <select id="fieldCategory">
            <!-- script.js が /api/meta から取得して追加する -->
          </select>
        </label>
        <label class="field"><span>保管場所</span>
          <input type="text" id="fieldLocation" maxlength="100" list="locationOptions">
          <datalist id="locationOptions"></datalist>
        </label>
      </div>

      <div class="field-row">
        <label class="field"><span>購入日</span>
          <input type="date" id="fieldPurchase">
        </label>
        <label class="field"><span>値段(円)</span>
          <input type="number" id="fieldPrice" min="0" step="1" inputmode="numeric">
        </label>
      </div>

      <div class="field-row">
        <label class="field"><span>購入店舗</span>
          <input type="text" id="fieldStore" maxlength="100" list="storeOptions">
          <datalist id="storeOptions"></datalist>
        </label>
        <label class="field"><span>保証期限</span>
          <input type="date" id="fieldWarranty">
        </label>
      </div>
      
      <label class="field"><span>手放した日(空欄なら所持中)</span>
        <input type="date" id="fieldDisposal">
      </label>

      <label class="field"><span>備考</span>
        <textarea id="fieldNote" rows="3" maxlength="500"></textarea>
      </label>

      <div class="actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" id="cancelButton" class="btn sub">キャンセル</button>
      </div>
    </form>
  </div>

  <!-- 動きの本体はすべて script.js に書いている -->
  <script src="script.js"></script>
</body>
</html>
